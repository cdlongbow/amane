services:
  amane:
    image: ghcr.io/sqzw-x/amane:latest
    container_name: amane
    # 对齐宿主机 UID/GID, 避免挂载目录出现 root 属主文件
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - /path/to/media:/media
    environment:
      - AMANE_DATA_DIR=/data
      - AMANE_LOG_LEVEL=INFO
      - AMANE_SUPERVISED=1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
